name: CI Pipeline

    on:
      push:
        branches: [ "main" ]
      pull_request:
        branches: [ "main" ]

    # Tự động hủy workflow cũ nếu có commit mới được push lên cùng một PR
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    jobs:
      validate:
        name: Lint, Test & Build Check
        runs-on: ubuntu-latest

        steps:
          - name: Checkout repository
            uses: actions/checkout@v4

          - name: Install pnpm
            uses: pnpm/action-setup@v4
            with:
              version: 12.8.1
              run_install: false

          - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
              node-version: 20
              cache: 'pnpm'

          - name: Install dependencies
            run: pnpm install --frozen-lockfile

          - name: Run ESLint
            run: pnpm run lint

          - name: Run Unit Tests
            run: pnpm run test

          - name: Verify Next.js Build
            env:
                NODE_ENV: production
                NEXT_TELEMETRY_DISABLE: 1

                GEMINI_API_KEY: "mock-gemini-key-for-ci-build-only"

                DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mock_db?sslmode=disable"
                NEXTAUTH_URL: "http://localhost:3000"
                NEXTAUTH_SECRET: "mock-secret-key-at-least-32-characters-long-ci"
                GOOGLE_CLIENT_ID: "mock-google-client-id"
                GOOGLE_CLIENT_SECRET: "mock-google-client-secret"
            run: pnpm run build
